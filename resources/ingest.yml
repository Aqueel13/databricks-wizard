resources:
  pipelines:
    wizard_bronze:
      name: wizard-bronze
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      continuous: false
      channel: CURRENT
      libraries:
        - file:
            path: ../pipelines/bronze.py
      configuration:
        wizard.landing: /Volumes/${var.catalog}/bronze/landing

    wizard_silver:
      name: wizard-silver
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      continuous: false
      channel: CURRENT
      libraries:
        - file:
            path: ../pipelines/silver.py
      environment:
        dependencies:
          - openpyxl==3.1.5
      configuration:
        wizard.catalog: ${var.catalog}
        wizard.pipelines_path: ${workspace.file_path}/pipelines

    wizard_gold:
      name: wizard-gold
      catalog: ${var.catalog}
      schema: gold
      serverless: true
      continuous: false
      channel: CURRENT
      libraries:
        - file:
            path: ../pipelines/gold.sql
      configuration:
        catalog: ${var.catalog}

  jobs:
    wizard_ingest:
      name: wizard-ingest
      description: Runs the bronze pipeline whenever the shipper completes a batch (a new manifest lands).
      max_concurrent_runs: 1
      queue:
        enabled: true
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/bronze/landing/_manifests/
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 75
      environments:
        - environment_key: er
          spec:
            client: "2"
            dependencies:
              - splink==4.0.6
              - sqlglot==25.32.1
              - duckdb==1.1.3
              - unidecode==1.3.8
      tasks:
        - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.wizard_bronze.id}
        - task_key: silver
          depends_on:
            - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.wizard_silver.id}
        - task_key: vector_index_sync
          depends_on:
            - task_key: silver
          environment_key: er
          spark_python_task:
            python_file: ../jobs/sync_vector_index.py
        - task_key: entity_resolution
          depends_on:
            - task_key: silver
          environment_key: er
          spark_python_task:
            python_file: ../er/jobs/run_er.py
            parameters: ["--er-root", "${workspace.file_path}/er"]
        - task_key: gold
          depends_on:
            - task_key: entity_resolution
          pipeline_task:
            pipeline_id: ${resources.pipelines.wizard_gold.id}
        - task_key: semantic_layer
          depends_on:
            - task_key: governance
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../pipelines/semantic_layer.sql
        - task_key: governance
          depends_on:
            - task_key: gold
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../pipelines/governance.sql
        - task_key: health_check
          depends_on:
            - task_key: semantic_layer
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../pipelines/health_check.sql
