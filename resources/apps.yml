resources:
  apps:
    steward:
      name: wizard-steward
      description: Supplier data steward workbench - match review queue and sanctions alerts (Databricks Wizard)
      source_code_path: ../apps/steward
      resources:
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: ingest-job
          job:
            id: ${resources.jobs.wizard_ingest.id}
            permission: CAN_MANAGE_RUN
    mcp:
      name: wizard-mcp
      description: Databricks Wizard MCP servers - /analytics/mcp, /knowledge/mcp, /stewardship/mcp (supplier intelligence for agents)
      source_code_path: ../apps/mcp
      resources:
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
