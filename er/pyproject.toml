[project]
name = "wizard-er"
version = "0.1.0"
description = "Databricks Wizard entity resolution: normalization, Splink scoring, LLM adjudication, clustering, survivorship"
requires-python = ">=3.11,<3.13"
dependencies = [
    "splink==4.0.6",
    "sqlglot==25.32.1",   # splink 4.0.x needs an era-matched sqlglot (newer versions break level parsing)
    "duckdb==1.1.3",
    "unidecode==1.3.8",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "databricks-sdk==0.38.0",
    "pyarrow>=15,<19",
]

[project.scripts]
wizard-er = "wizard_er.dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wizard_er"]
