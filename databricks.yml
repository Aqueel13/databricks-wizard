# Databricks Asset Bundle for Databricks Wizard.
#   databricks bundle validate
#   databricks bundle deploy
#   databricks bundle run wizard_ingest
bundle:
  name: databricks-wizard

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds every layer
    default: wizard
  alert_email:
    description: Address for job failure emails. Not committed; set in .databricks/bundle/<target>/variable-overrides.json locally and the BUNDLE_VAR_alert_email secret in CI.
  ci_service_principal:
    description: Application ID of the wizard-ci service principal that deploys from GitHub Actions
    default: 84c149b5-1d4a-4c35-bef0-434059df4e8c
  warehouse_id:
    description: SQL warehouse for SQL tasks, Genie and dashboards
    lookup:
      warehouse: Serverless Starter Warehouse

# One deployment, shared by people and CI: both targets deploy the same resources from the same state, kept in the
# CI service principal's home folder (not /Workspace/Shared, which every user can write). A deploy from a laptop
# and a deploy from GitHub Actions therefore update the same resources and never create duplicates.
workspace:
  root_path: /Workspace/Users/${var.ci_service_principal}/.bundle/${bundle.name}

# The CI service principal and workspace admins manage every resource; jobs and pipelines keep running as their owner.
permissions:
  - level: CAN_MANAGE
    service_principal_name: ${var.ci_service_principal}
  - level: CAN_MANAGE
    group_name: admins

targets:
  dev:
    default: true
    workspace:
      profile: wizard
  ci:
    # GitHub Actions: DATABRICKS_HOST + DATABRICKS_CLIENT_ID/SECRET of the wizard-ci service principal (OAuth M2M)
    workspace: {}
