[project]
name = "wizard-sources"
version = "0.1.0"
description = "Databricks Wizard: simulated enterprise source systems (SAP, Coupa, HICX, documents) and data generator"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.1.3",
    "psycopg[binary]==3.2.3",
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "openpyxl==3.1.5",
    "reportlab==4.2.5",
    "pillow==11.0.0",
    "unidecode==1.3.8",
]

[project.scripts]
wizard-sources = "wizard_sources.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wizard_sources"]
