[project]
name = "wizard-shipper"
version = "0.1.0"
description = "Databricks Wizard landing shipper: local sources -> Unity Catalog volume, with manifests"
requires-python = ">=3.11,<3.13"
dependencies = [
    "databricks-sdk==0.38.0",
    "confluent-kafka==2.6.1",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
]

[project.scripts]
wizard-shipper = "wizard_shipper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wizard_shipper"]
